<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Settings for Fullscreen Mobile App mode -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#047857">
    <title>VendorDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toast-hidden { transform: translateY(-150%); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased select-none">

    <!-- Toast Notification -->
    <div id="toast" class="toast-hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-5 py-3 rounded-full shadow-lg flex items-center space-x-2 z-50 w-max">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span class="font-medium text-sm" id="toast-text">Receipt Saved!</span>
    </div>

    <!-- Receipt Modal Popup -->
    <div id="receipt-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative">
            <div class="text-center pb-4 border-b border-gray-100">
                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Official Invoice</span>
                <h3 id="modal-customer" class="text-lg font-extrabold text-gray-900 mt-2">Customer</h3>
                <p id="modal-date" class="text-xs text-gray-400">Date</p>
            </div>
            <div class="py-5 space-y-3">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">Item Description:</span>
                    <span id="modal-desc" class="font-semibold text-gray-800 text-right">Item</span>
                </div>
                <div class="flex justify-between text-sm border-t border-gray-50 pt-3">
                    <span class="text-gray-500">Amount Paid:</span>
                    <span id="modal-amount" class="font-extrabold text-emerald-700 text-base">₦0</span>
                </div>
            </div>
            <div class="space-y-2 pt-2">
                <button onclick="shareToWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-bold text-sm py-3 rounded-xl shadow-md transition-all flex justify-center items-center space-x-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    <span>Send via WhatsApp</span>
                </button>
                <button onclick="closeModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold text-sm py-3 rounded-xl transition-all">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-md overflow-hidden pb-10">
        <header class="bg-emerald-700 text-white p-6 rounded-b-[2rem] shadow-sm">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-2xl font-bold tracking-tight">VendorDesk.</h1>
                <div class="bg-emerald-600 p-2 rounded-xl shadow-inner">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
            </div>
            <p class="text-emerald-100 text-sm opacity-90">Welcome back, Boss.</p>
        </header>

        <main class="px-5 -mt-4 relative z-10">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Total Revenue</p>
                    <p class="text-xl font-extrabold text-gray-900" id="total-revenue">₦0</p>
                </div>
                <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm">
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">Invoices Sent</p>
                    <p class="text-xl font-extrabold text-gray-900" id="total-invoices">0</p>
                </div>
            </div>

            <div class="bg-white border border-gray-100 p-5 rounded-3xl shadow-sm mb-8">
                <h2 class="text-sm font-bold text-gray-800 mb-4 flex items-center">
                    <span class="bg-emerald-100 w-2 h-2 rounded-full mr-2"></span>
                    Create New Receipt
                </h2>
                
                <form id="receipt-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 ml-1">Customer Name</label>
                        <input type="text" id="customer-name" required class="w-full bg-gray-50 border border-gray-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 ml-1">Amount Paid (₦)</label>
                        <input type="number" id="amount" required class="w-full bg-gray-50 border border-gray-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1 ml-1">Item Description</label>
                        <input type="text" id="item-desc" required class="w-full bg-gray-50 border border-gray-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
                    </div>
                    <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm py-4 rounded-xl shadow-md transition-all mt-2">
                        Save Receipt
                    </button>
                </form>
            </div>

            <div>
                <div class="mb-4">
                    <input type="text" id="search-bar" onkeyup="searchReceipts()" placeholder="Search customer name..." class="w-full bg-white border border-gray-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm transition-all">
                </div>

                <div class="flex justify-between items-end mb-3 px-1">
                    <h2 class="text-sm font-bold text-gray-800">Recent Receipts (Tap to View)</h2>
                </div>
                
                <div class="bg-white border border-gray-100 rounded-3xl overflow-hidden shadow-sm">
                    <ul class="divide-y divide-gray-50" id="receipt-list"></ul>
                </div>
            </div>
        </main>
    </div>

    <script>
        let receipts = JSON.parse(localStorage.getItem('vendordesk_receipts')) || [];
        let currentActiveReceipt = null;

        function renderDashboard() {
            let totalRev = 0;
            const list = document.getElementById('receipt-list');
            list.innerHTML = '';

            if (receipts.length === 0) {
                list.innerHTML = '<li class="p-4 text-center text-sm text-gray-500">No receipts saved yet.</li>';
            } else {
                receipts.forEach((r, idx) => {
                    totalRev += parseInt(r.amount);
                    const initials = r.name.substring(0, 2).toUpperCase();
                    
                    const li = document.createElement('li');
                    li.className = "receipt-item p-4 flex justify-between items-center hover:bg-emerald-50/50 cursor-pointer transition-colors";
                    li.setAttribute('onclick', `openReceipt(${idx})`);
                    li.setAttribute('data-name', r.name);
                    li.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="bg-emerald-100 text-emerald-700 font-bold w-10 h-10 rounded-full flex items-center justify-center text-sm uppercase">
                                ${initials}
                            </div>
                            <div>
                                <p class="text-sm font-bold text-gray-800">${r.name}</p>
                                <p class="text-xs text-gray-400">${r.desc}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold text-emerald-700">₦${parseInt(r.amount).toLocaleString()}</p>
                            <p class="text-[10px] text-gray-400">${r.date}</p>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }

            document.getElementById('total-revenue').innerText = '₦' + totalRev.toLocaleString();
            document.getElementById('total-invoices').innerText = receipts.length;
        }

        document.getElementById('receipt-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('customer-name').value;
            const amount = document.getElementById('amount').value;
            const desc = document.getElementById('item-desc').value;
            const date = new Date().toLocaleDateString();

            receipts.unshift({ name, amount, desc, date });
            localStorage.setItem('vendordesk_receipts', JSON.stringify(receipts));

            const toast = document.getElementById('toast');
            toast.classList.remove('toast-hidden');
            toast.classList.add('toast-active');
            setTimeout(() => {
                toast.classList.remove('toast-active');
                toast.classList.add('toast-hidden');
            }, 2000);

            document.getElementById('receipt-form').reset();
            renderDashboard();
        });

        function openReceipt(idx) {
            currentActiveReceipt = receipts[idx];
            document.getElementById('modal-customer').innerText = currentActiveReceipt.name;
            document.getElementById('modal-desc').innerText = currentActiveReceipt.desc;
            document.getElementById('modal-amount').innerText = '₦' + parseInt(currentActiveReceipt.amount).toLocaleString();
            document.getElementById('modal-date').innerText = currentActiveReceipt.date;
            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('receipt-modal').classList.add('hidden');
        }

        function shareToWhatsApp() {
            if (!currentActiveReceipt) return;
            const text = `Hello ${currentActiveReceipt.name},%0A%0AHere is your receipt for *${currentActiveReceipt.desc}*.%0A%0A*Amount Paid:* ₦${parseInt(currentActiveReceipt.amount).toLocaleString()}%0A*Date:* ${currentActiveReceipt.date}%0A%0AThank you for your patronage!`;
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function searchReceipts() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const items = document.querySelectorAll('.receipt-item');
            items.forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        renderDashboard();
    </script>
</body>
</html>
